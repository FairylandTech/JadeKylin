app:
  name: jade-kylin
  mode: debug            # debug | release | test
  addr: ":8080"
  shutdown_timeout: 10   # 优雅退出等待秒数

log:
  level: debug           # debug | info | warn | error
  format: console        # console | json
  output: both           # stdout | file | both
  dir: logs
  filename: app.log
  max_size: 100          # MB
  max_backups: 7
  max_age: 30            # 天
  compress: false
  caller: true
  skip_paths:
    - /healthz

rate_limit:
  enabled: true
  rps: 20                # 每个 IP 每秒请求数
  burst: 40

cors:
  enabled: true
  allow_origins:
    - "*"
