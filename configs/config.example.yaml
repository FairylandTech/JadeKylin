app:
  name: jade-kylin
  mode: debug            # debug | release | test
  run_mode: ""           # local | dev 时跳过登录认证并以初始管理员身份访问（可用 RUN_MODE 覆盖）；不能与 release 同时使用
  addr: ":8080"
  shutdown_timeout: 10   # 优雅退出等待秒数

log:
  level: debug           # debug | info | warn | error
  format: console        # console | json
  output: both           # stdout | file | both
  dir: logs
  filename: app.log
  max_size: 100          # MB
  max_backups: 7
  max_age: 30            # 天
  compress: false
  caller: true
  skip_paths:
    - /healthz

rate_limit:
  enabled: true
  rps: 20                # 每个 IP 每秒请求数
  burst: 40

cors:
  enabled: true
  allow_origins:
    - "*"

postgres:
  enabled: false         # 使用 PostgreSQL 时改为 true
  dsn: ""                # 推荐通过 KYLIN_DATABASE_DSN 设置，避免提交密码
  max_conns: 10
  min_conns: 0
  connect_timeout: 5     # 秒，包含启动 Ping 等待时间
  max_conn_lifetime: 3600 # 秒
  max_conn_idle_time: 300 # 秒

redis:
  enabled: false
  url: "redis://localhost:6379/0" # 认证使用 KYLIN_REDIS_URL=redis://users:password@host:6379/0；TLS 使用 rediss://
  pool_size: 10
  min_idle_conns: 0
  connect_timeout: 5 # 秒，包含启动 Ping
  read_timeout: 3    # 秒
  write_timeout: 3   # 秒

auth:
  jwt_secret: ""     # 推荐通过 KYLIN_JWT_SECRET 设置，至少 32 字节；为空时不注册登录接口
  issuer: jade-kylin
  token_ttl: 900     # 秒，JWT 有效期（15 分钟）
  idle_timeout: 600  # 秒，10 分钟无请求会话失效；有请求即续期
  max_sessions: 1    # 每个用户同时在线设备数，0 不限制；超出时踢掉最早登录的设备
  captcha_ttl: 120   # 秒，验证码有效期
